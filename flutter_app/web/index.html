<!DOCTYPE html>
<html lang="ja">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Material Design 3 Expressive を採用した高機能・高速ホワイトボードアプリケーション">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Whiteboard">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Whiteboard — Material 3 Expressive</title>
  <link rel="manifest" href="manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #f3edf7;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #211f26;
      }
    }
  </style>
  <script>
    (function() {
      try {
        var raw = localStorage.getItem('whiteboard_prefs_v1');
        if (raw) {
          var prefs = JSON.parse(raw);
          if (prefs && prefs.theme === 'dark') {
            document.documentElement.style.backgroundColor = '#211f26';
          } else if (prefs && prefs.theme === 'light') {
            document.documentElement.style.backgroundColor = '#f3edf7';
          }
        }
      } catch (_) {}
    })();
  </script>
</head>
<body oncontextmenu="return false;">
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
